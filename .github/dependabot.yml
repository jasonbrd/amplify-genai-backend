version: 2
updates:
  # --- npm ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      npm-security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "npm"
    directory: "/amplify-lambda-js"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      npm-security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  # --- pip (plain requirements.txt only) ---
  - package-ecosystem: "pip"
    directory: "/amplify-agent-loop-lambda"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      pip-security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "pip"
    directory: "/amplify-lambda-assistants-api-google"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      pip-security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "pip"
    directory: "/amplify-lambda-assistants-api-office365"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      pip-security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "pip"
    directory: "/amplify-lambda-js/litellm"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      pip-security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "pip"
    directory: "/amplify-lambda/markitdown"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      pip-security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  # NOTE: The following 13 directories use pip-compile (requirements.in -> requirements.txt).
  # Dependabot cannot auto-fix these. Security alerts will still appear, but fixes must be
  # applied manually by updating requirements.in and running pip-compile.
  #
  # Affected directories:
  #   /amplify-assistants
  #   /amplify-lambda-admin
  #   /amplify-lambda-api
  #   /amplify-lambda-artifacts
  #   /amplify-lambda-assistants-api
  #   /amplify-lambda-ops
  #   /amplify-lambda-python-base
  #   /amplify-lambda
  #   /chat-billing
  #   /data-disclosure
  #   /embedding
  #   /object-access
  #   /scripts
